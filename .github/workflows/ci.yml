name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "action.yml"
      - "bin/**"
      - "examples/heartbeats/**"
      - "examples/heartbeats/node-job.mjs"
      - "examples/heartbeats/postgres-backup.sh"
      - "package.json"
      - "server.json"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "action.yml"
      - "bin/**"
      - "examples/heartbeats/**"
      - "examples/heartbeats/node-job.mjs"
      - "examples/heartbeats/postgres-backup.sh"
      - "package.json"
      - "server.json"
      - "test/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check bin/nimo-check.mjs
          node --check examples/heartbeats/node-job.mjs
          bash -n examples/heartbeats/postgres-backup.sh
      - name: Installed CLI help and bad input
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          export npm_config_cache="$smoke_dir/cache"
          export npm_config_update_notifier=false
          tarball=$(npm pack --offline --ignore-scripts \
            --pack-destination "$smoke_dir")
          cd "$smoke_dir" || exit
          npm install --offline --ignore-scripts --no-audit --no-fund \
            "./$tarball"

          help=$(./node_modules/.bin/nimo-check --help)
          printf '%s\n' "$help"
          grep -q '^Usage: nimo-check ' <<< "$help"

          code=0
          ./node_modules/.bin/nimo-check || code=$?
          test "$code" -eq 2
      - name: Tests
        run: npm test
      - name: server.json is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("server.json","utf8"))'
