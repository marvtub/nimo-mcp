name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "action.yml"
      - "bin/**"
      - "examples/heartbeats/**"
      - "examples/heartbeats/node-job.mjs"
      - "examples/heartbeats/postgres-backup.sh"
      - "package.json"
      - "server.json"
      - "test/**"
      - "test-support/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "action.yml"
      - "bin/**"
      - "examples/heartbeats/**"
      - "examples/heartbeats/node-job.mjs"
      - "examples/heartbeats/postgres-backup.sh"
      - "package.json"
      - "server.json"
      - "test/**"
      - "test-support/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check bin/nimo-check.mjs
          node --check examples/heartbeats/node-job.mjs
          bash -n examples/heartbeats/postgres-backup.sh
      - name: Installed CLI smoke and loopback results
        shell: bash
        run: |
          fixture_test="$PWD/test/nimo-check-e2e.test.mjs"
          smoke_dir=$(mktemp -d)
          export npm_config_cache="$smoke_dir/cache"
          export npm_config_update_notifier=false
          tarball=$(npm pack --offline --ignore-scripts \
            --pack-destination "$smoke_dir")
          cd "$smoke_dir" || exit
          npm install --offline --ignore-scripts --no-audit --no-fund \
            "./$tarball"

          help=$(./node_modules/.bin/nimo-check --help)
          printf '%s\n' "$help"
          grep -q '^Usage: nimo-check ' <<< "$help"

          code=0
          ./node_modules/.bin/nimo-check || code=$?
          test "$code" -eq 2

          NIMO_CHECK_BIN="$smoke_dir/node_modules/.bin/nimo-check" \
            node --test "$fixture_test"
      - name: Tests
        run: npm test
      - name: Check server.json syntax and description
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          // See ServerDetail.description in the declared 2025-12-11 schema.
          const server = JSON.parse(readFileSync("server.json", "utf8"));
          const description = server?.description;
          const length = typeof description === "string"
            ? [...description].length : null;
          if (length === null || length < 1 || length > 100) {
            const found = length === null
              ? "missing or not a string" : `${length} code points`;
            console.error(
              "Edit server.json: description must be a string of 1-100 " +
              `Unicode code points (found ${found}).`,
            );
            process.exitCode = 1;
          }
          NODE
      - name: Start loopback Nimo fixture
        id: fixture
        shell: bash
        run: |
          port_file=$(mktemp)
          node --input-type=module > "$port_file" 2> "$port_file.err" <<'NODE' &
          import { createNimoFixture } from "./test-support/nimo-loopback.mjs";
          const server = createNimoFixture();
          server.listen(0, "127.0.0.1", () => {
            console.log(server.address().port);
          });
          setTimeout(() => {
            server.close();
            server.closeAllConnections();
          }, 60_000).unref();
          NODE
          fixture_pid=$!
          for ((attempt = 0; attempt < 50; attempt++)); do
            if read -r port < "$port_file" && [[ "$port" =~ ^[0-9]+$ ]]; then
              printf 'port=%s\n' "$port" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            kill -0 "$fixture_pid" 2>/dev/null || break
            sleep 0.1
          done
          echo 'Loopback Nimo fixture did not start.' >&2
          cat "$port_file.err" >&2
          exit 1
      - name: Run the Nimo action against the fixture
        id: nimo
        uses: ./
        env:
          NIMO_TRY_MCP_URL: http://127.0.0.1:${{ steps.fixture.outputs.port }}
        with:
          url: https://example.com
          timeout: "5"
      - name: Assert the published Nimo score
        shell: bash
        env:
          NIMO_SCORE: ${{ steps.nimo.outputs.score }}
        run: |
          if [[ -z "$NIMO_SCORE" ]]; then
            echo 'Nimo score output is empty; expected 87.' >&2
            exit 1
          fi
          if [[ "$NIMO_SCORE" != 87 ]]; then
            printf 'Wrong Nimo score output: expected 87, got %q.\n' \
              "$NIMO_SCORE" >&2
            exit 1
          fi
          echo 'The next step received Nimo score 87.'
      - name: Prepare the action deadline watchdog
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/nimo-deadline.bash" <<'BASH'
          node() {
            local code=0 stderr="$RUNNER_TEMP/nimo-deadline.stderr"
            timeout -k 2s 10s node "$@" 2> "$stderr" || code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/nimo-deadline.exit"
            cat "$stderr" >&2
            return "$code"
          }
          BASH
      - name: Run the Nimo action on a pending job
        id: nimo_deadline
        uses: ./
        continue-on-error: true
        timeout-minutes: 1
        env:
          BASH_ENV: ${{ runner.temp }}/nimo-deadline.bash
          NIMO_TRY_MCP_URL: http://127.0.0.1:${{ steps.fixture.outputs.port }}
        with:
          url: https://pending.example
          timeout: "2"
      - name: Assert the Nimo action's own deadline failure
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.nimo_deadline.outcome }}
        run: |
          # The CLI prints Checking only after it receives a valid job.
          expected='Checkingnimo-check: no result after 2 seconds'
          if [[ "$ACTION_OUTCOME" != failure ]] ||
             ! grep -Fxq '2' "$RUNNER_TEMP/nimo-deadline.exit" ||
             ! grep -Fxq "$expected" "$RUNNER_TEMP/nimo-deadline.stderr"; then
            echo 'Expected a pending job and a Nimo timeout at 2s.' >&2
            exit 1
          fi
          echo 'Nimo accepted the pending job and reported its 2s timeout.'
