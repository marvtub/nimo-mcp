# Check the live site after a deploy. Copy to .github/workflows/.
# When a check runs, the score, LCP, layout shift, server response and the
# fix to make first appear in the run summary. Free, no account or secret.
name: Check site after deploy

on:
  deployment_status:   # Vercel, Netlify and others report deploys this way
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to check
        required: true
        type: string

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_URL: >-
        ${{ inputs.url || github.event.deployment_status.environment_url }}
    steps:
      - name: Report missing site URL
        if: env.TARGET_URL == ''
        shell: bash
        run: |
          echo 'No site check ran: no URL provided.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: marvtub/nimo-mcp@v1.0.1
        if: env.TARGET_URL != ''
        with:
          url: ${{ env.TARGET_URL }}
          min-score: 50   # fail the check if the page gets much slower
